
trigger:
  - main

pool:
  name: 'archhana-agentpool'

steps:
  - checkout: self

  - script: |
      terraform version
    displayName: 'Check Terraform Installation'

  - task: AzureCLI@2
    displayName: 'Terraform Init Validate Plan'
    inputs:
      azureSubscription: 'Azure-Terraform-Connection'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)'
      inlineScript: |
        set -e
        export ARM_USE_CLI=true

        terraform init
        terraform validate
        terraform plan
